apiVersion: 2023-05-01
location: eastus
name: milvus-service
resourceGroup: RandDai-001
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/fdf1d582-0d39-4030-a125-53a231da7454/resourceGroups/{resource-group}/providers/Microsoft.App/managedEnvironments/randai-env
  configuration:
    activeRevisionsMode: single
    secrets:
      - name: minio-access-key
        value: "minioadmin"
      - name: minio-secret-key
        value: "minioadmin"
    ingress:
      external: false
      targetPort: 19530
  template:
    containers:
      - name: milvus
        image: randdaiacr.azurecr.io/milvus:v2.3.3
        command: ["milvus", "run", "standalone"]
        env:
          - name: ETCD_ENDPOINTS
            value: "localhost:2379"
          - name: MINIO_ADDRESS
            value: "localhost:9000"
        resources:
          cpu: "2"
          memory: "4Gi"
      - name: etcd
        image: randdaiacr.azurecr.io/etcd:v3.5.5
        command: 
          - "/usr/local/bin/etcd"
          - "-advertise-client-urls=http://localhost:2379"
          - "-listen-client-urls=http://0.0.0.0:2379"
          - "--data-dir=/etcd"
        volumeMounts:
          - mountPath: /etcd
            volumeName: etcd-data
        resources:
          cpu: "0.5"
          memory: "1Gi"
      - name: minio
        image: randdaiacr.azurecr.io/minio:RELEASE.2023-03-20T20-16-18Z
        env:
          - name: MINIO_ACCESS_KEY
            secretRef: minio-access-key
          - name: MINIO_SECRET_KEY
            secretRef: minio-secret-key
        command: ["minio", "server", "/data"]
        volumeMounts:
          - mountPath: /data
            volumeName: minio-data
        resources:
          cpu: "0.5"
          memory: "1Gi"
    volumes:
      - name: etcd-data
        storageType: AzureFile
        storageName: etcd-storage
      - name: minio-data
        storageType: AzureFile
        storageName: minio-storage
    scale:
      minReplicas: 1
      maxReplicas: 1