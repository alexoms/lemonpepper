---
apiVersion: 2023-05-01
location: eastus
name: ollama-service
resourceGroup: your-resource-group
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/{subscription-id}/resourceGroups/{resource-group}/providers/Microsoft.App/managedEnvironments/{environment-name}
  configuration:
    activeRevisionsMode: single
  template:
    containers:
      - name: ollama
        image: your-acr.azurecr.io/ollama:latest
        resources:
          cpu: 2
          memory: "4Gi"
          gpu:
            count: 1
            sku: V100
        volumeMounts:
          - mountPath: /root/.ollama
            volumeName: ollama-data
    volumes:
      - name: ollama-data
        storageType: AzureFile
        storageName: ollama-storage
    scale:
      minReplicas: 1
      maxReplicas: 1